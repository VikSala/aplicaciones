name: mural-web

services:
  mural:
    build:
      context: .
      target: runtime
    image: mural-web:13
    container_name: mural-web
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 3001
      STATIC_DIR: /app/dist
      USAGE_DATA_FILE: /app/data/usage.json
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_service_account
    ports:
      - "${MURAL_BIND_IP:-127.0.0.1}:${MURAL_PORT:-3001}:3001"
    volumes:
      - mural_usage:/app/data
    secrets:
      - google_service_account
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mural_usage:

secrets:
  google_service_account:
    file: ${GOOGLE_CREDENTIALS_FILE:-./mural-chirp.json}

networks:
  default:
    name: mural-web-network
