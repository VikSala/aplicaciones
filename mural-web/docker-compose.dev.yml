name: mural-web-dev

services:
  api:
    build:
      context: .
      target: development
    command: npm run dev:api
    working_dir: /app
    volumes:
      - .:/app
      - mural_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      API_PORT: 3001
    env_file:
      - .env

  web:
    build:
      context: .
      target: development
    command: npm run dev:web
    working_dir: /app
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - mural_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://api:3001

volumes:
  mural_node_modules:
